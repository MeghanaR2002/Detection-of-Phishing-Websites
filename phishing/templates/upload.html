<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login</title>
    <style>
        * {
            margin: 0px;
        }

        .header {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            background-image: url("../static/img .4.jfif");
            background-size: 100% 300px;
            width: 100%;
            height: 300px;
            position: relative;
        }
        .menu-container {
            position:absolute;
            top: 0;
            right: 0;
            margin-top: 50px;
        }
        .menu {
           text-decoration: none;
            color: lightblue;
            background-color: darkblue;
            padding: 25px;
            border-radius: 10px;
            margin-right: 10px;
            font-size: 18px;
        }
        .menu:hover {
            background-color: darkcyan;
            color: lightcyan;
        }
        .login-container {
          margin-top: 50px;
        }
        h1 {
            margin-bottom: 20px;
        }
        label {
            font-size: 20px;
        }
        input[type=text],input[type=password] {
          width: 200px;
          height: 40px;
          font-size: 20px;
        }
        input[type="submit"] {
         width: 100px;
         height:50px;
         font-size: 20px;
         font-weight: bold;
         border-radius: 5px;
         color: darkcyan;
         background-color: lightcyan;
         cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: darkblue;
            color: white;
        }

    
    </style>
</head>
<body>
    <div class="header">
        <div class="menu-container">
    
            <a class="menu" href="/home">Home</a>
            <a class="menu" href="/login">Login </a>
            <a class="menu" href="/Upload">Upload</a>
        </div>    
    </div>
    <center>
        <form action="/read_data" method="post" enctype="multipart/form-data">
        <div class="login-container">
            <h1>Upload Form</h1>
            <label>Choose the file: </label>
            <input type="file" name="filedata" id="filedata" required/>
            <br /></br />

            <input type="submit" value="Upload" />
        </div>
        </form>
        </center>
</body>
</html>
